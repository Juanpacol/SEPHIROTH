name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisory scan for newly-disclosed CVEs even with no code changes.
    - cron: "0 6 * * 1"

jobs:
  # Blocking: secrets and high-confidence/high-severity SAST findings are
  # 100% actionable — no reason to ever let these ride.
  secrets-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks diffs the PR's first commit's parent through its last
          # commit — a shallow checkout (depth 1 or a fixed small depth)
          # leaves that parent missing as soon as a PR has more than a
          # couple of commits ("unknown revision"), failing the job
          # regardless of content. Full history removes the guesswork;
          # this repo is small enough that the extra clone time is noise.
          fetch-depth: 0
      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "bandit[toml]"
      - name: bandit (HIGH severity + HIGH confidence only)
        run: |
          bandit -c pyproject.toml -r . -ll -ii -f txt | tee bandit-report.txt
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            { echo "## Bandit (HIGH/HIGH)"; echo '```'; cat bandit-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Advisory: dependency CVEs churn constantly (including in transitives
  # with no fix yet) — never let these turn main permanently red.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install pip-audit
      - name: pip-audit (Python dependency CVEs)
        run: |
          pip-audit -r requirements.txt -f markdown | tee pip-audit-report.md
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            { echo "## pip-audit (advisory)"; cat pip-audit-report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: npm audit (advisory)
        working-directory: platform/frontend
        run: |
          npm ci
          npm audit --audit-level=high | tee ../../npm-audit-report.txt || true
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            { echo "## npm audit (advisory, high+)"; echo '```'; cat ../../npm-audit-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Advisory *for now*: the Security tab has never received an analysis
  # (code-scanning/alerts -> 404 "no analysis found"), so the baseline is
  # unknown. Flip condition: promote to blocking, and add to security-gate's
  # needs, once the baseline is triaged to zero.
  codeql:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript is the current single CodeQL pack name
        # covering both JS and TS.
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      # No autobuild/build-mode step and no `pip install`: both packs extract
      # without a build here. The src/ layout and the platform/-on-PYTHONPATH
      # rule (see CLAUDE.md) may degrade cross-file dataflow resolution for
      # Python, not extraction itself. If a future run shows extraction
      # failing, the repo's existing recipe is code-review.yml's `test` job
      # (`pip install -r requirements-dev.txt` then `pip install -e .`) —
      # not implemented pre-emptively here.
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      # analyze@v3 uploads SARIF itself — no separate upload-sarif step.
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # Advisory *for now* — see the codeql job comment above for the flip
  # condition. Frontend-only SAST: gitleaks already owns secrets (no
  # p/secrets ruleset here).
  semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install semgrep
      # OSS CLI entrypoint (`semgrep scan`), not `semgrep ci` — the latter is
      # the cloud entrypoint and requires SEMGREP_APP_TOKEN. `|| true` keeps
      # later steps in this job running even though a finding makes semgrep
      # exit non-zero; p/nextjs is deliberately not used (existence
      # unverified).
      - name: semgrep scan (advisory, platform/frontend)
        run: |
          semgrep scan \
            --config p/typescript --config p/react --config p/owasp-top-ten \
            --metrics=off --sarif --output semgrep.sarif \
            platform/frontend || true
      - name: Semgrep summary (advisory)
        run: |
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "## Semgrep (advisory, platform/frontend)"
              if [ -s semgrep.sarif ]; then
                total=$(jq '[.runs[].results[]] | length' semgrep.sarif)
                echo "Total findings: $total"
                echo
                echo "| Rule | Count |"
                echo "|---|---|"
                jq -r '[.runs[].results[].ruleId] | group_by(.) | map("| \(.[0]) | \(length) |") | .[]' semgrep.sarif
              else
                echo "No semgrep.sarif produced."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Single required status check for branch protection ("SEGURIDAD" gate).
  # Only secrets-sast gates the merge; dependency-audit stays advisory
  # (continue-on-error), so its failures never block this job.
  security-gate:
    runs-on: ubuntu-latest
    needs: [secrets-sast, dependency-audit]
    steps:
      - run: echo "Security gate passed - no secrets, no high-confidence/high-severity SAST findings."

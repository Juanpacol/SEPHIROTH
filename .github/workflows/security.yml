name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisory scan for newly-disclosed CVEs even with no code changes.
    - cron: "0 6 * * 1"

jobs:
  # Blocking: secrets and high-confidence/high-severity SAST findings are
  # 100% actionable — no reason to ever let these ride.
  secrets-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks diffs the PR's first commit's parent through its last
          # commit — a shallow checkout (depth 1 or a fixed small depth)
          # leaves that parent missing as soon as a PR has more than a
          # couple of commits ("unknown revision"), failing the job
          # regardless of content. Full history removes the guesswork;
          # this repo is small enough that the extra clone time is noise.
          fetch-depth: 0
      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "bandit[toml]"
      - name: bandit (HIGH severity + HIGH confidence only)
        run: |
          bandit -c pyproject.toml -r . -ll -ii -f txt | tee bandit-report.txt
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            { echo "## Bandit (HIGH/HIGH)"; echo '```'; cat bandit-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Advisory: dependency CVEs churn constantly (including in transitives
  # with no fix yet) — never let these turn main permanently red.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install pip-audit
      - name: pip-audit (Python dependency CVEs)
        run: |
          pip-audit -r requirements.txt -f markdown | tee pip-audit-report.md
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            { echo "## pip-audit (advisory)"; cat pip-audit-report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: npm audit (advisory)
        working-directory: platform/frontend
        run: |
          npm ci
          npm audit --audit-level=high | tee ../../npm-audit-report.txt || true
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            { echo "## npm audit (advisory, high+)"; echo '```'; cat ../../npm-audit-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Single required status check for branch protection ("SEGURIDAD" gate).
  # Only secrets-sast gates the merge; dependency-audit stays advisory
  # (continue-on-error), so its failures never block this job.
  security-gate:
    runs-on: ubuntu-latest
    needs: [secrets-sast, dependency-audit]
    steps:
      - run: echo "Security gate passed - no secrets, no high-confidence/high-severity SAST findings."

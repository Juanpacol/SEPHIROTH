name: Code Review

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      # Pinned, not `pip install ruff`: the formatter's output is
      # version-dependent, so an unpinned upgrade turns main red with no code
      # change. Keep in step with requirements-dev.txt.
      - run: pip install ruff==0.16.3
      # `check` first is the useful order, but it aborts the job on failure and
      # hides whatever `format --check` would have said — run both, then fail.
      - run: |
          status=0
          ruff check . || status=1
          ruff format --check . || status=1
          exit $status

  # Validates each commit's subject against the SF<NNN> <body> [<type>]
  # format — see CONTRIBUTING.md "Commit message format" and ADR-015. Uses
  # `git log` against the real merge-base rather than the pull_request
  # event's commit list, which is capped/paginated for large PRs. Merge/
  # revert commits are skipped by the validator itself. This check does NOT
  # verify that <NNN> is globally unique across branches — that's an
  # accepted, documented gap (ADR-015), not an oversight.
  #
  # Dependabot-authored commits are skipped two ways: by subject prefix
  # inside the validator (`dependabot: `), and by author email here. The
  # second exists because Dependabot *security*-update PRs may open without
  # matching a configured ecosystem entry, and therefore possibly without
  # the prefix — the author-email check is a second, independent net.
  commit-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate commit messages in this PR
        run: |
          status=0
          while IFS=$'\x1f' read -r author_email subject; do
            if [[ "${author_email,,}" == *dependabot* ]]; then
              echo "skipping $subject (Dependabot author)"
              continue
            fi
            python3 scripts/validate_commit_msg.py --message "$subject" || status=1
          done < <(git log --format=%ae%x1f%s "origin/${{ github.base_ref }}..HEAD")
          exit $status
      # This repo only allows "Rebase and merge" (allow_merge_commit: false,
      # allow_squash_merge: false in the repo settings) — a linear-history
      # policy. That setting only governs the button GitHub itself offers
      # for landing the PR; it does nothing to stop a merge commit living
      # *inside* a branch's own history (e.g. from `git merge origin/main`
      # to update a branch instead of `git rebase origin/main`), and a merge
      # commit there can replay strangely — or fail outright — under
      # "Rebase and merge". Fail loudly instead of finding out at merge time.
      - name: No merge commits in this branch (rebase, don't merge, to update it)
        run: |
          merges=$(git log --merges --format=%H "origin/${{ github.base_ref }}..HEAD")
          if [ -n "$merges" ]; then
            echo "Found merge commit(s) in this branch's history:"
            git log --merges --oneline "origin/${{ github.base_ref }}..HEAD"
            echo
            echo "This repo only allows 'Rebase and merge'. Update a branch with"
            echo "'git rebase origin/${{ github.base_ref }}' (then push --force-with-lease),"
            echo "never 'git merge origin/${{ github.base_ref }}'."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Editable install puts src/sephiroth on the path the same way it is in
      # production. `pythonpath` in pyproject only covers pytest.
      - run: pip install -e .
      - name: Run tests with coverage gate
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # Advisory: mypy has never gated this repo, so it surfaces a real 61-error
  # baseline (DEBT-012, docs/project-state.yaml) across pre-existing code.
  # continue-on-error until that baseline is worked down — flip to blocking
  # (and add to code-review-gate's needs) once `mypy -p sephiroth -p api -p
  # intelligence` is clean.
  type-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - name: mypy (advisory)
        run: |
          mypy -p sephiroth -p api -p intelligence | tee mypy-report.txt || true
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            { echo "## mypy (advisory)"; echo '```'; cat mypy-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # SDD gate: proves the implementation matches the specs (docs/00-migration-
  # charter.md, docs/specs/) rather than just "code runs" — spec front-matter,
  # every acceptance criterion in an Implemented spec exists in the test
  # tree, feature-registry consistency, and frozen contract schema drift.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: Documentation gates (specs, diagrams, project state, links)
        run: python scripts/docs_check.py --verbose
      - name: Contract schema drift
        run: python scripts/export_contracts.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # WebKit as well as Chromium: safe-area insets, `dvh`, and `position:
      # fixed` under the on-screen keyboard only misbehave in Safari, so a
      # Chromium-only matrix would pass on every one of them.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: platform/frontend/playwright-report/
          retention-days: 7

  # Builds the real production Docker image and boots it against a real
  # Postgres — the only check that would have caught, e.g., a file missing
  # from the image's COPY list (migrations/ + alembic.ini were once
  # forgotten here). Deliberately skips anything needing GEMINI_API_KEY —
  # scripts/smoke_test.sh only exercises health/auth/patients/dashboard.
  docker-build-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: clinical_ai
          POSTGRES_PASSWORD: clinical_ai_password
          POSTGRES_DB: clinical_ai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinical_ai -d clinical_ai_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sephiroth-api:ci .
      - name: Run container
        run: |
          docker run -d --name sephiroth-api-ci \
            --network host \
            -e DATABASE_URL="postgresql+asyncpg://clinical_ai:clinical_ai_password@localhost:5432/clinical_ai_db" \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e ENVIRONMENT=development \
            sephiroth-api:ci
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "backend never became healthy"; docker logs sephiroth-api-ci; exit 1
      - name: Smoke test
        run: bash scripts/smoke_test.sh http://127.0.0.1:8000
      # OS-only (scanners: vuln + vuln-type: os): the image also carries the
      # resolved Python environment (Dockerfile:10-11 -> :26), which
      # pip-audit (security.yml:58) already covers, and gitleaks owns
      # secrets — this step would otherwise double-report both. CRITICAL
      # only: this job is in code-review-gate's needs, so anything reported
      # here must be 100% actionable (security.yml:12-13). ignore-unfixed:
      # true: an unfixable CRITICAL in python:3.11-slim would otherwise red
      # main permanently with no action the maintainer can take
      # (security.yml:43-44). `severity:` filters both the report and the
      # exit code, so HIGH findings are neither shown nor fatal, by design.
      - name: Trivy (CRITICAL OS-package CVEs in the built image)
        # No floating major tag for this action, unlike every other action in
        # this repo — pin the exact release and re-verify its inputs when
        # bumping (gh api repos/aquasecurity/trivy-action/releases/latest).
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Recent trivy-action pulls the vulnerability DB from GHCR, which is
          # subject to anonymous pull rate limits; this job is on the
          # required path, so a DB-fetch failure would red the gate for a
          # non-security reason. The ECR mirror avoids that limit.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        with:
          scan-type: image
          image-ref: sephiroth-api:ci
          scanners: vuln
          vuln-type: os
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs sephiroth-api-ci

  # Regression guard for the 2026-08-20 crash-loop incident: `docker-build-
  # smoke-test` above runs with ENVIRONMENT=development, which is the one
  # environment where config.py's jwt_secret validator never raises --
  # meaning that job structurally cannot catch a production-only config
  # failure. This job boots with ENVIRONMENT=production instead, and
  # separately asserts that a deliberately-bad config produces a legible
  # error rather than a silent crash loop with no traceback in the logs.
  prod-config-parity:
    runs-on: ubuntu-latest
    needs: docker-build-smoke-test
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: clinical_ai
          POSTGRES_PASSWORD: clinical_ai_password
          POSTGRES_DB: clinical_ai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinical_ai -d clinical_ai_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sephiroth-api:ci .

      - name: Boot with ENVIRONMENT=production
        run: |
          docker run -d --name prod-parity \
            --network host \
            -e ENVIRONMENT=production \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e PHI_ENCRYPTION_KEY="$(python3 -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" \
            -e DATABASE_URL="postgresql+asyncpg://clinical_ai:clinical_ai_password@localhost:5432/clinical_ai_db" \
            sephiroth-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "FAIL: container never became healthy under ENVIRONMENT=production"
          docker logs prod-parity
          exit 1
      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs prod-parity

      # The regression test for the incident itself: a bad config must fail
      # loudly and legibly, not silently. PYTHONUNBUFFERED=1 (Dockerfile) is
      # what makes this message actually reach `docker logs` instead of
      # being lost to stdout buffering.
      - name: Assert bad config fails with a readable message
        run: |
          set +e
          OUTPUT=$(docker run --rm -e ENVIRONMENT=production -e JWT_SECRET=short sephiroth-api:ci 2>&1)
          set -e
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "jwt_secret must be" \
            || { echo "FAIL: bad-config error produced no legible message"; exit 1; }

  # Single required status check for branch protection ("CODE REVIEW" gate).
  # No human approval is required — solo-maintainer repo, and GitHub refuses
  # to count a PR author's own approval toward a required-review count, so a
  # "require approvals" rule here would be permanently unsatisfiable. This
  # job is the automated stand-in: style (lint), commit hygiene
  # (commit-lint), behavior (test, coverage gate), spec conformance (docs —
  # every Implemented spec's acceptance criteria must exist in the test
  # tree, contracts must not have drifted), frontend (lint/test/build/e2e),
  # and real deployability (docker-build-smoke-test, prod-config-parity).
  # type-check is deliberately excluded (see its own job comment).
  code-review-gate:
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        commit-lint,
        test,
        docs,
        frontend,
        docker-build-smoke-test,
        prod-config-parity,
      ]
    steps:
      - run: echo "Code review gate passed - lint, tests+coverage, SDD spec conformance, frontend, and deploy smoke test all green."

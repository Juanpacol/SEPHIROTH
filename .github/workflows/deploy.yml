name: Deploy

# Runs after CI succeeds on main — never deploys a commit that hasn't
# passed lint/commit-lint/secrets-scan/frontend build+unit (quality),
# pytest+coverage+contract-drift (test), and the real docker build+boot+
# smoke test under both dev and prod config (deploy-smoke). Single-
# environment (production) with the live smoke test as the gate: if it
# fails, we redeploy the last known-good commit automatically rather than
# leaving a broken deploy live.
#
# NOTE: this workflow's exact Render API response shapes are written
# against Render's documented v1 API but have not yet been exercised
# against a real Render service (none existed at authoring time) — treat
# the first real run as a dry-run and check the Actions log carefully.
#
# SF081: "CI" is the single required workflow since the CI/CD compression —
# it already contains everything that used to be split across "Code
# Review" and "Security" (secrets scan folded into the `quality` job).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Record the currently-live commit, before deploying
        id: prev_live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          # Must run before triggering the new deploy below -- querying
          # "?status=live&limit=1" *after* the new deploy has gone live
          # would return the very commit we're trying to roll back away
          # from, making a rollback a no-op that just redeploys the same
          # broken commit.
          # Render's list-deploys endpoint wraps each item in a
          # {"deploy": {...}, "cursor": ...} envelope (unlike the
          # single-deploy GET/POST endpoints below, which return the raw
          # deploy object) -- confirmed against Render's own API reference
          # after this exact line failed with `KeyError: 'commit'` on the
          # first real deploy.
          PREV_COMMIT=$(curl -sf "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?status=live&limit=1" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['deploy']['commit']['id'])")
          echo "commit=$PREV_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy for this commit
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          RESPONSE=$(curl -sf -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\": \"$COMMIT_SHA\"}")
          echo "$RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -sf "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            echo "deploy status: $STATUS"
            if [ "$STATUS" = "live" ]; then exit 0; fi
            case "$STATUS" in
              build_failed|update_failed|canceled|deactivated)
                echo "deploy ended with status $STATUS"; exit 1 ;;
            esac
            sleep 10
          done
          echo "timed out waiting for the deploy to go live"; exit 1

      - name: Smoke test the live deployment
        id: smoke
        env:
          # Production has allow_bootstrap_registration=false (render.yaml),
          # so self-registration no longer works here -- set these repo
          # secrets to a dedicated, already-registered clinician account for
          # smoke_test.sh to log in with instead. Falls back to the
          # register flow if unset (fails loudly against a hardened prod,
          # which is the intended signal that the secrets need setting).
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: bash scripts/smoke_test.sh "${{ vars.RENDER_SERVICE_URL }}"

      - name: Roll back to the previous live deploy on smoke test failure
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          PREV_COMMIT: ${{ steps.prev_live.outputs.commit }}
        run: |
          echo "::warning::Smoke test failed against the new deploy — rolling back to $PREV_COMMIT"
          curl -sf -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\": \"$PREV_COMMIT\"}"
          exit 1

  # Frontend (Vercel). Runs only after the backend deploy above went live and
  # passed its live smoke test (`needs: deploy`), so the frontend never ships
  # ahead of an API it depends on, and never ships from a commit CI rejected.
  #
  # Vercel's own Git auto-deploy is turned OFF for `main`
  # (platform/frontend/vercel.json), otherwise it would deploy every push
  # without waiting for CI. Pull-request Previews still come from Vercel's Git
  # integration. This job is therefore the only path to production.
  #
  # Vercel CLI is pinned. Run from the repo root, not platform/frontend: the
  # project's Root Directory setting (platform/frontend) is applied by the CLI.
  #
  # NOTE: written against Vercel's documented CLI flow but not yet exercised
  # against the real project — treat the first run as a dry run.
  deploy-frontend:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Fail loudly: silently skipping would leave the frontend stale with a
      # green pipeline, which is how it went 16 days without a deploy.
      - name: Require Vercel credentials
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PRODUCTION_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set (repo secret/variable) — frontend not deployed"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull Vercel project settings and environment
        run: npx --yes vercel@64.3.1 pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        run: npx --yes vercel@64.3.1 build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to production
        run: |
          url=$(npx --yes vercel@64.3.1 deploy --prebuilt --prod --token "$VERCEL_TOKEN" | tail -n 1)
          echo "deployed: $url"

      - name: Smoke test the live frontend
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$PRODUCTION_URL/login"; then
              echo "frontend up: $PRODUCTION_URL/login"
              exit 0
            fi
            echo "attempt $i: not up yet"
            sleep 5
          done
          echo "::error::$PRODUCTION_URL/login never returned 200 after the deploy"
          exit 1

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisory scan for newly-disclosed CVEs even with no code changes.
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Editable install puts src/sephiroth on the path the same way it is in
      # production. `pythonpath` in pyproject only covers pytest.
      - run: pip install -e .
      - name: Run tests with coverage gate
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: RAG evaluation (deterministic, offline) — regression gate
        run: python -m intelligence.evaluation.run --mode ci
        env:
          PYTHONPATH: .:platform

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: Documentation gates (specs, diagrams, project state, links)
        run: python scripts/docs_check.py --verbose
      - name: Contract schema drift
        run: python scripts/export_contracts.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  # Builds the real production Docker image and boots it against a real
  # Postgres — the only check that would have caught, e.g., a file missing
  # from the image's COPY list (migrations/ + alembic.ini were once
  # forgotten here). Deliberately skips anything needing GEMINI_API_KEY —
  # scripts/smoke_test.sh only exercises health/auth/patients/dashboard.
  docker-build-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: clinical_ai
          POSTGRES_PASSWORD: clinical_ai_password
          POSTGRES_DB: clinical_ai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinical_ai -d clinical_ai_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sephiroth-api:ci .
      - name: Run container
        run: |
          docker run -d --name sephiroth-api-ci \
            --network host \
            -e DATABASE_URL="postgresql+asyncpg://clinical_ai:clinical_ai_password@localhost:5432/clinical_ai_db" \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e ENVIRONMENT=development \
            sephiroth-api:ci
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "backend never became healthy"; docker logs sephiroth-api-ci; exit 1
      - name: Smoke test
        run: bash scripts/smoke_test.sh http://127.0.0.1:8000
      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs sephiroth-api-ci

  # Regression guard for the 2026-08-20 crash-loop incident: `docker-build-
  # smoke-test` above runs with ENVIRONMENT=development, which is the one
  # environment where config.py's jwt_secret validator never raises --
  # meaning that job structurally cannot catch a production-only config
  # failure. This job boots with ENVIRONMENT=production instead, and
  # separately asserts that a deliberately-bad config produces a legible
  # error rather than a silent crash loop with no traceback in the logs.
  prod-config-parity:
    runs-on: ubuntu-latest
    needs: docker-build-smoke-test
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: clinical_ai
          POSTGRES_PASSWORD: clinical_ai_password
          POSTGRES_DB: clinical_ai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinical_ai -d clinical_ai_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sephiroth-api:ci .

      - name: Boot with ENVIRONMENT=production
        run: |
          docker run -d --name prod-parity \
            --network host \
            -e ENVIRONMENT=production \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e DATABASE_URL="postgresql+asyncpg://clinical_ai:clinical_ai_password@localhost:5432/clinical_ai_db" \
            sephiroth-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "FAIL: container never became healthy under ENVIRONMENT=production"
          docker logs prod-parity
          exit 1
      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs prod-parity

      # The regression test for the incident itself: a bad config must fail
      # loudly and legibly, not silently. PYTHONUNBUFFERED=1 (Dockerfile) is
      # what makes this message actually reach `docker logs` instead of
      # being lost to stdout buffering.
      - name: Assert bad config fails with a readable message
        run: |
          set +e
          OUTPUT=$(docker run --rm -e ENVIRONMENT=production -e JWT_SECRET=short sephiroth-api:ci 2>&1)
          set -e
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "jwt_secret must be" \
            || { echo "FAIL: bad-config error produced no legible message"; exit 1; }

  # Blocking: secrets and high-confidence/high-severity SAST findings are
  # 100% actionable — no reason to ever let these ride.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks diffs `HEAD^..HEAD` — depth 1 on a pull_request checkout
          # leaves no parent commit to diff against ("unknown revision"),
          # failing the job on every PR regardless of content. Depth 2 is
          # enough for that single-commit diff; push events keep full
          # history (0) for their own broader scans.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "bandit[toml]"
      - name: bandit (HIGH severity + HIGH confidence only)
        run: |
          bandit -c pyproject.toml -r . -ll -ii -f txt | tee bandit-report.txt
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            { echo "## Bandit (HIGH/HIGH)"; echo '```'; cat bandit-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Advisory: dependency CVEs churn constantly (including in transitives
  # with no fix yet) — never let these turn main permanently red.
  security-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install pip-audit
      - name: pip-audit (Python dependency CVEs)
        run: |
          pip-audit -r requirements.txt -f markdown | tee pip-audit-report.md
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            { echo "## pip-audit (advisory)"; cat pip-audit-report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: npm audit (advisory)
        working-directory: platform/frontend
        run: |
          npm ci
          npm audit --audit-level=high | tee ../../npm-audit-report.txt || true
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            { echo "## npm audit (advisory, high+)"; echo '```'; cat ../../npm-audit-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

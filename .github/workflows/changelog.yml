name: Changelog

# Auto-generates CHANGELOG.md entries grouped by SF<NNN> story on every push
# to main, then opens a PR and merges it once required checks pass.
#
# main has branch protection configured on GitHub (not a file in this repo):
# no direct pushes, 2 required status checks. A PR opened with the default
# GITHUB_TOKEN never
# triggers those checks — GitHub intentionally suppresses events triggered
# by GITHUB_TOKEN to prevent infinite workflow loops, which also means a
# GITHUB_TOKEN-opened PR can never satisfy "required checks" and would sit
# blocked forever. GH_PAT_CHANGELOG (a fine-grained PAT, Contents+Pull
# requests: read/write, scoped to this repo) is what lets the PR run as a
# real user action and trigger Code Review's push/pull_request checks
# normally.
on:
  push:
    branches: [main]

jobs:
  changelog:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT_CHANGELOG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # generate_changelog.py needs full history to read `cursor..HEAD`
          token: ${{ secrets.GH_PAT_CHANGELOG }} # so the later `git push` authenticates as the PAT, not GITHUB_TOKEN

      - name: Generate changelog entries since the last run
        run: python3 scripts/generate_changelog.py

      - name: Open a PR with the update, if anything changed
        id: open_pr
        run: |
          if git diff --quiet -- CHANGELOG.md scripts/.changelog_cursor; then
            echo "Nothing to commit."
            exit 0
          fi

          SF_ID=$(bash scripts/next-sf-id.sh)
          BRANCH="changelog/$(echo "$SF_ID" | tr '[:upper:]' '[:lower:]')-auto-update"

          git config user.name "sephiroth-changelog-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md scripts/.changelog_cursor
          git commit -m "$SF_ID Auto-update CHANGELOG.md with entries grouped by story [chore]"
          git push -u origin "$BRANCH"

          gh pr create --title "$SF_ID Auto-update CHANGELOG.md" \
            --body "Automated changelog update — generated by \`scripts/generate_changelog.py\`. See \`.github/workflows/changelog.yml\`." \
            --base main --head "$BRANCH"

          PR_NUMBER=$(gh pr view "$BRANCH" --json number -q .number)
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Wait for required checks, then merge
        if: steps.open_pr.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
        run: |
          for i in $(seq 1 30); do
            STATE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus -q .mergeStateStatus)
            echo "mergeStateStatus: $STATE"
            if [ "$STATE" = "CLEAN" ]; then
              gh pr merge "$PR_NUMBER" --rebase --delete-branch
              exit 0
            fi
            # BLOCKED just means "required checks still running" while
            # they're pending — the only states worth bailing out on early
            # are ones no amount of waiting fixes (a real conflict, or a
            # check that already failed).
            if [ "$STATE" = "DIRTY" ] || [ "$STATE" = "UNSTABLE" ]; then
              echo "PR #$PR_NUMBER is $STATE — leaving it open for manual review."
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for checks — leaving PR #$PR_NUMBER open for manual merge."

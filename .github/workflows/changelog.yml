name: Changelog

# Auto-generates CHANGELOG.md entries grouped by SF<NNN> story on every push
# to main, and commits the result back with the default GITHUB_TOKEN.
#
# Safe from an infinite loop: GitHub does not trigger new workflow runs from
# a push made with the default GITHUB_TOKEN (documented behavior, not a
# workaround we're relying on informally). No paths-ignore needed.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # generate_changelog.py needs full history to read `cursor..HEAD`

      - name: Generate changelog entries since the last run
        run: python3 scripts/generate_changelog.py

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- CHANGELOG.md scripts/.changelog_cursor; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "sephiroth-changelog-bot"
          git config user.email "actions@github.com"
          git add CHANGELOG.md scripts/.changelog_cursor
          git commit -m "docs: auto-update CHANGELOG.md [skip changelog]"
          git push

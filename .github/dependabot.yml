# Coupling: changing `commit-message.prefix` below requires changing
# `_SKIP_PATTERN` in `scripts/validate_commit_msg.py` in the same commit —
# without a matching skip, every Dependabot bump PR is unmergeable
# (`commit-lint` is a required check, ADR-015).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "dependabot"
      prefix-development: "dependabot"
    labels: ["dependencies"]

  - package-ecosystem: "npm"
    directory: "/platform/frontend"
    schedule:
      interval: weekly
      day: tuesday
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "dependabot"
      prefix-development: "dependabot"
    labels: ["dependencies"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "dependabot"
      prefix-development: "dependabot"
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "dependabot"
      prefix-development: "dependabot"
    labels: ["dependencies"]

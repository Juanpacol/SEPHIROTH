[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sephiroth"
version = "0.2.0"
description = "Evidence-grounded, model-agnostic multi-agent AI runtime for clinical decision support"
requires-python = ">=3.11"
# Runtime dependencies stay in requirements.txt (the deployment contract);
# this table exists so `pip install -e .` puts `src/sephiroth` on the path for
# uvicorn, `python -m`, and Docker alike — not just pytest. See
# docs/00-migration-charter.md §4.
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
# Explicit, never autodiscovery: autodiscovery would try to package the legacy
# roots (intelligence/, data/, platform/) and change what is importable.
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "platform"]
markers = [
    "spec: verifies an acceptance criterion from a docs/specs/SPEC-*.md",
    "contract: locks an externally-observable contract (wire format, schema)",
    "integration: exercises more than one subsystem together",
    "legacy: characterizes pre-migration behaviour; deleted with its shim",
]

[tool.mypy]
# Same three roots pytest and ruff already cover. explicit_package_bases lets
# mypy resolve api.*/intelligence.* (no root __init__.py, per the "platform/
# must not be a package" rule in CLAUDE.md) and sephiroth.* (src layout) in
# one run instead of three.
mypy_path = "src:.:platform"
explicit_package_bases = true
ignore_missing_imports = true

# The ratchet (DEBT-012). Whole-repo mypy is advisory — it still reports a real
# backlog — but these files are clean *now*, and `tests/test_mypy_clean_modules.py`
# reads this list and fails if any of them regresses. That is what makes the
# gate real: one list, enforced by the suite the `test` CI job already runs,
# rather than a second copy in a workflow that can drift.
#
# Its own table, not `[tool.mypy.clean]`: mypy parses every key under
# `[tool.mypy]` and warns on ones it doesn't know.
#
# Move a file here only once `mypy <file>` is clean. Never remove one to make a
# build pass — that is the ratchet slipping.
[tool.mypy-ratchet]
files = [
  "platform/api/main.py",
  "platform/api/routers/approvals.py",
  "platform/api/routers/dashboard.py",
  "platform/api/routers/rag.py",
  "platform/api/services/result_service.py",
  "platform/api/workflows/engine.py",
  "src/sephiroth/models/ollama.py",
  "src/sephiroth/runtime/executor.py",
  "src/sephiroth/verification/combined.py",
  "intelligence/evaluation/runner.py",
  "intelligence/mcp/vision_server.py",
]

# Stricter inside the clean set. `warn_unused_ignores` is the half people forget:
# it flags a `# type: ignore` that has stopped being necessary (a SQLAlchemy or
# Pillow upgrade, say), so the ignores added to get here can't quietly fossilize.
[[tool.mypy.overrides]]
module = [
  "api.main",
  "api.routers.approvals",
  "api.routers.dashboard",
  "api.routers.rag",
  "api.services.result_service",
  "api.workflows.engine",
  "sephiroth.models.ollama",
  "sephiroth.runtime.executor",
  "sephiroth.verification.combined",
  "intelligence.evaluation.runner",
  "intelligence.mcp.vision_server",
]
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
# concurrency="greenlet": SQLAlchemy's async ORM runs its sync DBAPI calls
# inside a greenlet switch (greenlet_spawn). Without this, coverage's tracer
# loses the current thread's trace function across that switch, so any code
# after a *second* awaited query in the same coroutine silently reports as
# uncovered even though it demonstrably ran (verified with a debug print
# during the Phase C coverage investigation) -- a false negative, not a real
# gap. See https://coverage.readthedocs.io/en/latest/config.html#run
# (concurrency) and the SQLAlchemy asyncio/greenlet FAQ.
concurrency = ["greenlet", "thread"]
# One entry per package. Never add "src/sephiroth" wholesale — a wildcard root
# silently absorbs future subpackages, so new code would be invisible to the
# 87% gate while CI stayed green. Enforced by tests/test_coverage_config.py.
source = [
    "src/sephiroth/contracts",
    "src/sephiroth/models",
    "src/sephiroth/tools",
    "src/sephiroth/runtime",
    "src/sephiroth/verification",
    "src/sephiroth/safety",
    "src/sephiroth/clinical",
    "src/sephiroth/context",
    "src/sephiroth/telemetry",
    "src/sephiroth/workflows",
    "intelligence/agents",
    "intelligence/mcp",
    "intelligence/evaluation",
    "intelligence/nlp/__init__.py",
    "intelligence/nlp/timeline_extractor.py",
    "data/rag",
    "data/schemas",
    "data/embeddings",
    "data/vectors",
    "platform/api",
    "platform/auth",
    "platform/core",
]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "data/embeddings/build_artifact.py",
    # Shims (docs/00-migration-charter.md §3) — trivial re-exports, counting
    # them would inflate coverage while hiding real gaps. Nothing left to
    # omit here today: intelligence/agents/{base,workflow}.py (Phase 3
    # shims) were deleted in Phase 5, DEBT-010 (one phase later than
    # scheduled). The Phase 1 intelligence/llm/* shim was deleted in Phase
    # 3, DEBT-008. The Phase 2 intelligence/mcp/registry.py shim was
    # deleted in Phase 4, DEBT-009. intelligence/agents/{__init__,
    # citation_guard,risk_engine,explainability}.py remain real
    # implementation, not shims.
]

[tool.coverage.report]
fail_under = 87
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
omit = [
    # Phase 6: intelligence/agents/{risk_engine,citation_guard,explainability}.py
    # shims deleted (docs/00-migration-charter.md rule 3) — nothing left to omit.
]

[tool.ruff]
line-length = 110
exclude = [
    "references",
    "platform/frontend",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
# `platform/` is on PYTHONPATH rather than a normal src layout (see
# CLAUDE.md), so ruff can't infer these first-party roots on its own.
known-first-party = ["api", "auth", "core", "data", "intelligence", "sephiroth", "tests"]

[tool.bandit]
exclude_dirs = [
    "references",
    "platform/frontend",
    ".venv",
    "tests",
]

services:
  - type: web
    name: sephiroth-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon # pinned to the service's current region -- changing this recreates the service
    # Free plan is capped at 1 instance anyway; pinned explicitly because
    # init_db() runs `alembic upgrade head` on every boot (core/db.py) --
    # two instances booting concurrently would race on the same migration.
    numInstances: 1
    autoDeploy: false # deploys are triggered explicitly by the CD workflow, gated on the smoke test
    healthCheckPath: /health # liveness only, no I/O -- see /health/ready for the DB-backed deep check
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1" # belt-and-braces with the Dockerfile ENV -- keeps crash tracebacks from being lost to buffering
      - key: ALLOW_BOOTSTRAP_REGISTRATION
        value: "false" # this DB already has real clinicians; open self-registration is not a dev-only default anymore
      - key: JWT_SECRET
        sync: false # set manually in the Render dashboard — never committed
      - key: DATABASE_URL
        sync: false # Supabase session-pooler connection string — never committed
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # SPEC-009 workflow tick. ENABLE_WORKFLOW_ENGINE stays "false" until
      # a phase-7 deploy has been smoke-tested; flipping it on requires
      # INTERNAL_TICK_TOKEN to already be set (>=32 chars — see
      # Settings._check_tick_token) or the app fails to boot in production.
      # Point an external cron (e.g. cron-job.org, free tier, every 5 min)
      # at POST /internal/tick with header X-Internal-Token: <token> — no
      # worker/Redis/Celery involved, see SPEC-009.
      - key: ENABLE_WORKFLOW_ENGINE
        value: "false"
      - key: INTERNAL_TICK_TOKEN
        sync: false # set manually in the Render dashboard — never committed

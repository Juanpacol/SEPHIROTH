[extend]
useDefault = true

# Known false positives — a fake/placeholder value gitleaks' generic
# high-entropy rules flag anyway. Reviewed by hand; not a real credential.
[allowlist]
description = "Reviewed false positives"
paths = [
  # Personal local dev script: hardcodes an obviously-fake test token
  # ("test-token-12345-workflow-engine-test") for manually curling the
  # internal /tick endpoint — never a real secret.
  '''test_tick_request\.sh''',
]
# i18n data files use object fields like `labelKey`/`qKey`/`evidenceKey`
# holding dotted dictionary-key strings (e.g. "marketing.faq.q1") — the
# "Key"-suffixed field name plus a dotted lowercase string trips the
# generic-api-key rule's entropy heuristic. Reviewed by hand; these are
# translation-dictionary lookups, never credentials.
regexTarget = "line"
regexes = [
  '''[a-zA-Z]+Key: "[a-zA-Z][a-zA-Z0-9]*(\.[a-zA-Z][a-zA-Z0-9]*)+"''',
  # Built-in dev-only Fernet key for phi_encryption_key — Settings fails
  # fast at startup if this literal value is still in use outside dev
  # (see platform/core/config.py::_check_phi_encryption_key). Not a real
  # credential; it's the well-known fallback, checked against by value.
  '''DEFAULT_PHI_ENCRYPTION_KEY = "[A-Za-z0-9_=-]+"''',
]

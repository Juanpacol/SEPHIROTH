# Operational state of every component — the source of truth for "what actually
# works", as opposed to what is designed or hoped for.
#
# Updated at the end of every phase and whenever a component's status changes.
# `scripts/docs_check.py` verifies that every key under `components.*` resolves
# to a path that exists, so a rename cannot silently rot this file.
#
# status: implemented | partial | planned | deprecated | shim
#   shim = strangler-fig re-export only; see strangler_target/removed_in_phase

schema_version: 1
project: SEPHIROTH
version: 1.0.0
updated: 2026-08-21
phase_current: 8

phases:
  "0": {name: "Foundation, SDD scaffolding, tool-authorization hotfix", status: done}
  "1": {name: "ModelProvider abstraction", status: done}
  "2": {name: "Tool Runtime", status: done}
  "3": {name: "Agent Runtime + DEBT-008 closure (LangGraph removed in the same phase)", status: done}
  "4": {name: "Context Engine (4a, done — SPEC-005) + Verification & Safety (4b, done — SPEC-004)", status: done}
  "5": {name: "Observability, recovery, relocation, dynamic planner, debt cleanup (SPEC-006/007/008)", status: done}
  "6": {name: "Delete the 3 phase-5 shims owed by the charter's strangler-fig schedule", status: done}
  "7": {name: "Workflow automation substrate — durable tick, no worker process (SPEC-009)", status: done}
  "8": {name: "Event catalog — transactional outbox, no broker (SPEC-010)", status: done}

components:
  legacy:
    intelligence/mcp:
      status: implemented
      description: >-
        The 5 FastMCP servers (nlp, imaging, rag, drug_safety, vision).
        registry.py (the Phase 2 shim over src/sephiroth/tools) was deleted
        in Phase 4 (DEBT-009); all call sites now import
        sephiroth.tools.get_tool_runtime/ToolRuntime directly.
      tests: [tests/test_mcp.py, tests/test_mcp_extra.py, tests/test_tool_authorization.py]
    intelligence/evaluation:
      status: implemented
      description: Offline deterministic RAG eval, CI-blocking; RAG-scoped only
      tests: [tests/test_evaluation.py, tests/test_eval_cli.py, tests/test_eval_runner_full.py]
    intelligence/nlp/timeline_extractor.py:
      status: implemented
      description: LLM-first structured event extraction with lexicon fallback
      tests: [tests/test_timeline_extractor.py]
    data/rag:
      status: implemented
      description: Hybrid retrieval — keyword + dense, fused via RRF over 22 seed docs
      tests: [tests/test_rag_pipeline.py]
    data/embeddings:
      status: implemented
      tests: [tests/test_embeddings.py, tests/test_embeddings_matching.py, tests/test_corpus_hash.py]
    data/vectors:
      status: implemented
      description: In-memory brute-force cosine; no ANN index
      tests: [tests/test_embeddings.py]
    data/schemas:
      status: implemented
      tests: [tests/test_db_seed.py, tests/test_alembic_migration.py]
    platform/api:
      status: implemented
      tests: [tests/test_api_agents.py, tests/test_api_patients_rag.py, tests/test_main_health.py]
    platform/auth:
      status: implemented
      tests: [tests/test_auth.py]
    platform/core:
      status: implemented
      tests: [tests/test_config.py, tests/test_logging.py]
    platform/frontend:
      status: implemented
      description: Next.js 14; hand-rolled SSE parsing couples it to the wire contract

  runtime:
    src/sephiroth/contracts:
      status: implemented
      phase: 0
      spec: SPEC-000
      description: Leaf package of Pydantic domain contracts; JSON Schema drift-gated
      tests: [tests/test_contracts_schema.py, tests/test_contracts_models.py]
    src/sephiroth/models:
      status: implemented
      phase: 1
      spec: SPEC-001
      description: >-
        ModelProvider Protocol + GeminiClient/GroqClient/FallbackLLMClient/
        factory, retrofitted from intelligence/llm. llm_provider setting
        selects the primary; default config is byte-identical to pre-Phase-1.
      tests: [tests/test_model_provider_protocol.py, tests/test_throttle.py,
              tests/test_gemini_client.py, tests/test_groq_client.py,
              tests/test_fallback_client.py, tests/test_llm_factory.py]
    src/sephiroth/tools:
      status: implemented
      phase: 2
      spec: SPEC-002
      description: >-
        ToolRuntime (relocated MCPRegistry) + capability tags + per-call
        timeout, retrofitted from intelligence/mcp/registry.py. Closed
        DEBT-004 (unauthenticated direct-tool HTTP endpoints) in the same phase.
      tests: [tests/test_tool_runtime.py, tests/test_mcp.py,
              tests/test_mcp_extra.py, tests/test_tool_authorization.py,
              tests/test_medical_router.py]
    src/sephiroth/runtime:
      status: implemented
      phase: 3
      spec: SPEC-003
      description: >-
        Analyzer/Planner/Router + Agent (capability-bound) + async executor
        (fan-out/merge/coordinate), replacing the LangGraph-compiled graph
        entirely in this phase (ADR-001). route_specialists relocated
        verbatim. Since Phase 4 (SPEC-004), the executor's internal state is
        a real RunState — the SPEC-003 §10 deferral is resolved; ToolCall.tool
        vs. the frozen wire's name is projected at one function, _tool_call_wire.
        Since Phase 5 (SPEC-007), src/sephiroth/runtime/recovery.py
        classifies a failing specialist and retries/abstains per policy
        (ADR-007); RunState.lifecycle/.failures/.retries/.recovery_actions
        are populated for the first time. A specialist that exhausts
        retries no longer aborts the consultation — it contributes an
        empty section instead. Since Phase 5 (SPEC-008), NG-1 is closed:
        route_specialists_dynamic asks the model which specialists are
        relevant, gated by settings.enable_dynamic_planner (default False)
        and degrading to the static heuristic on any failure.
      tests: [tests/test_agent_registry.py, tests/test_runtime_executor.py,
              tests/test_no_langgraph.py, tests/test_workflow.py,
              tests/test_sse_contract.py, tests/test_api_agents.py,
              tests/test_prompt_contract.py, tests/test_runtime_recovery.py,
              tests/test_dynamic_planner.py]
    src/sephiroth/verification:
      status: implemented
      phase: 4
      spec: SPEC-004
      description: >-
        Claim extraction, evidence harvesting, batched 5-state claim
        verification (VerificationStatus), and deterministic confidence
        scoring. citation_guard.py relocated here in Phase 5, Part 3 (still
        a distinct pre-filter feeding this, per ADR-006 — not merged into
        claims/evidence).
      tests: [tests/test_verification_claims.py, tests/test_verification_evidence.py,
              tests/test_verification_verify.py, tests/test_verification_confidence.py,
              tests/test_citation_guard.py, tests/test_citation_guard_adversarial.py]
    src/sephiroth/safety:
      status: implemented
      phase: 4
      spec: SPEC-004
      description: >-
        Abstention gating (answer/partial/abstain, priority-ordered per
        ADR-008) and a minimal input-facing prompt-injection heuristic
        (F-041). PHI redaction, output-side toxicity/jailbreak classifiers,
        and rate limiting are explicitly deferred (SPEC-004 NG-2).
        risk_engine.py relocated here in Phase 5, Part 3 (src/sephiroth/
        safety/risk.py), read at request-time by patients.py/dashboard.py.
      tests: [tests/test_safety_abstention.py, tests/test_safety_output_safety.py,
              tests/test_risk_engine.py]
    src/sephiroth/context:
      status: implemented
      phase: 4
      spec: SPEC-005
      description: >-
        Per-agent context views (RunContext + AgentCapability.context_fields),
        lexical MMR reranking (no embeddings required), per-patient
        consultation memory (not a generic multi-turn session — see
        ADR-011), and character-budget truncation. Sibling to SPEC-004;
        depends only on SPEC-003's executor.
      tests: [tests/test_context_views.py, tests/test_context_rerank.py,
              tests/test_context_memory.py, tests/test_context_budget.py,
              tests/test_rag_pipeline.py, tests/test_api_agents.py]
    src/sephiroth/telemetry:
      status: partial
      phase: 5
      spec: SPEC-006
      description: >-
        Executes ADR-009: build_trace projects a populated RunState into
        the persisted ExecutionTrace contract (existing since Phase 0).
        traced_span records real spans for Executor.step and
        Verifier.check only (NG-1) — ModelProvider.chat and
        ToolRuntime.execute are not independently instrumented this cycle;
        token/cost accounting is a placeholder (NG-2). No pluggable
        Tracer/OTel backend yet (NG-3). explainability.py relocated here in
        Phase 5, Part 3 (src/sephiroth/telemetry/explain.py) — still the
        template-based (agents, tool_calls, citation_report) function, not
        yet reimplemented as an ExecutionTrace projection.
      tests: [tests/test_telemetry_span.py, tests/test_telemetry_build_trace.py,
              tests/test_runtime_executor.py]
    src/sephiroth/workflows:
      status: implemented
      phase: 7
      spec: SPEC-009
      description: >-
        Pure staleness/retry policy (is_stale, next_run_after,
        classify_step_failure, decide_step_recovery) for the workflow-tick
        engine. events.py (Phase 8, SPEC-010) is the one DB-touching
        exception in this package — emit()/dispatch_pending() live here
        rather than platform/api/workflows/ so src/sephiroth/safety/alerts.py
        (already clinical logic living in src/, existing precedent) can
        call emit() without platform/ importing back into src/ against
        ADR-010's intended direction. The rest of the DB-touching half
        (engine/registry/handlers/channels/instantiate) lives in
        platform/api/workflows/ — see that package's docstrings.
      tests: [tests/test_workflow_policy.py, tests/test_workflow_engine_tick.py,
              tests/test_internal_tick_auth.py, tests/test_workflow_alert_refresh.py,
              tests/test_workflow_channels.py, tests/test_workflow_events.py]

# Capabilities the target architecture requires that have no implementation yet.
gaps:
  - {capability: Confidence/abstention threshold tuning against the eval harness (SPEC-004 NG-3) — requires a live GEMINI_API_KEY run, not a build cycle, phase: null}
  - {capability: Context Engine tuning — max_context_chars/lambda_mult against real data (SPEC-005 NG-5) — requires a live GEMINI_API_KEY run, not a build cycle, phase: null}
  - {capability: Generic conversational/session memory — no validated product need yet (SPEC-005 NG-1), phase: null}
  - {capability: Output-facing safety beyond the prompt-injection heuristic — PHI/toxicity/jailbreak/HITL (SPEC-004 NG-2), phase: 5}
  - {capability: Live spans for ModelProvider.chat/ToolRuntime.execute + token/cost accounting + pluggable Tracer backend (SPEC-006 NG-1/2/3), phase: 5}
  - {capability: H1 unnecessary-invocation-rate measurement for the dynamic planner (SPEC-008 NG-3) — requires live traffic with the flag on, not a build cycle, phase: null}

quality_gates:
  coverage_fail_under: 87
  eval_blocking: true
  ci_jobs: [lint, test, eval, frontend, docker-build-smoke-test, security, security-advisory]

known_debt:
  - id: DEBT-001
    item: "Vendored MedCAT under intelligence/nlp/{ner,pipeline,preprocessing} has zero call sites"
    action: >-
      Deleted (Phase 5, Part 5) — 11 files, ~1581 lines, confirmed zero
      importers by grep before removal.
    phase: 5
    status: resolved
  - id: DEBT-002
    item: "Vendored MONAI under intelligence/medical-imaging should be a pip dependency"
    action: >-
      Deleted (Phase 5, Part 5) — 157 files. Found during removal that
      intelligence/mcp/imaging_server.py never imported this vendored tree
      in the first place; its real-inference branch already imports the
      `monai`/`torch` pip packages directly (both commented out in
      requirements.txt, gated behind settings.monai_model_path). Activating
      that branch — installing the real dependency and validating
      inference — is separate future work (F-013), not part of this
      cleanup.
    phase: 5
    status: resolved
  - id: DEBT-003
    item: "data/schemas GuidelineDocument persists a pgvector column that is never queried"
    action: >-
      Documented as intentional cold storage (Phase 5, Part 5) — no route
      reads or writes this table today; retrieval always runs against the
      in-memory vector store. Resolved by clarifying the docstring, not by
      building an ingestion endpoint (out of scope, no validated need).
    phase: 5
    status: resolved
  - id: DEBT-004
    item: "platform/api/routers/medical.py and rag.py exposed MCP tools with no authentication"
    action: "Depends(get_current_user) added to all 8 endpoints across both routers"
    phase: 2
    status: resolved
  - id: DEBT-005
    item: "intelligence/llm/factory.py::reset_llm_client had zero call sites"
    action: deleted along with all of intelligence/llm/* in Phase 3 (DEBT-008)
    phase: 3
    status: resolved
  - id: DEBT-006
    item: "docs/INTEGRATION_GUIDE.md described a structure that never existed"
    action: deleted; replaced by docs/04-development/setup.md
    status: resolved
  - id: DEBT-007
    item: "Vestigial AgentState dataclass in intelligence/agents/__init__.py"
    action: deleted alongside its only referent
    status: resolved
  - id: DEBT-008
    item: >-
      docs/00-migration-charter.md's shim schedule said intelligence/llm/*
      (created Phase 1) would be deleted in Phase 2. Phase 2's approved plan
      scoped only the Tool Runtime and did not include this — deleting it
      would have meant rewriting imports in ~16 files (agents, routers,
      evaluation, examples) outside that plan's approved scope.
    action: >-
      Deleted intelligence/llm/* and its ~16 import sites in Phase 3, one
      phase later than originally scheduled — did not slip further, per
      docs/00-migration-charter.md §3 rule 3: "a shim that survives two
      phases becomes permanent."
    phase: 3
    status: resolved
  - id: DEBT-009
    item: >-
      docs/00-migration-charter.md's shim schedule said
      intelligence/mcp/registry.py (created Phase 2) would be deleted in
      Phase 3. Phase 3's approved plan scoped Agent Runtime + DEBT-008 and
      did not include this.
    action: >-
      Deleted intelligence/mcp/registry.py and retargeted all callers
      (platform/api/routers/{medical,rag,patients}.py,
      tests/{test_mcp,test_tool_authorization}.py,
      examples/{tools_example,imaging_example}.py) onto
      src/sephiroth/tools directly, one phase later than originally
      scheduled — did not slip further, same pattern as DEBT-008.
    phase: 4
    status: resolved
  - id: DEBT-010
    item: >-
      docs/00-migration-charter.md's shim schedule said
      intelligence/agents/{base,workflow}.py (created Phase 3) would be
      deleted in Phase 4. Phase 4's approved scope was Context Engine
      (SPEC-005) + Verification & Safety (SPEC-004), not shim cleanup.
    action: >-
      Deleted intelligence/agents/{base,workflow}.py and retargeted all
      callers (platform/api/routers/agents.py,
      tests/{test_workflow,test_sse_contract}.py,
      examples/agents_example.py) onto src/sephiroth/runtime directly, one
      phase later than originally scheduled — did not slip further, same
      pattern as DEBT-008/DEBT-009. Also deleted
      tests/test_agent_registry.py::test_workflow_shim_run_consultation_is_the_real_executor
      (shim-identity test, nothing left to check identity against).
    phase: 5
    status: resolved

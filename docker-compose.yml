# Explicit project name so `docker ps`/`docker compose ls` always shows
# these as "sephiroth-*", regardless of the checkout folder's name and
# distinguishable at a glance from any other project's stack on this host.
name: sephiroth

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sephiroth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinical_ai
      POSTGRES_PASSWORD: clinical_ai_password
      POSTGRES_DB: clinical_ai_db
    ports:
      # Host 5433 — 5432 may be taken by other local projects.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical_ai -d clinical_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: sephiroth-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Always the local postgres service below, on purpose. This is NOT read
      # from `DATABASE_URL`: that is the variable a developer's `.env` and a
      # bare-metal `uvicorn` use, and when it once held the production URL a
      # plain `docker compose up --build` migrated production (AB#16, AB#18).
      # To point this container somewhere else you have to say so by name:
      # `API_DATABASE_URL=... docker compose up` (a remote host also needs
      # API_ALLOW_REMOTE_DB=true while ENVIRONMENT is development).
      DATABASE_URL: ${API_DATABASE_URL:-postgresql+asyncpg://clinical_ai:clinical_ai_password@postgres:5432/clinical_ai_db}
      ALLOW_REMOTE_DB: ${API_ALLOW_REMOTE_DB:-false}
      # Must match whatever key encrypted the data at DATABASE_URL above —
      # a mismatch fails closed with a clear error rather than returning
      # garbage (see platform/core/crypto.py). Only needed here when
      # API_DATABASE_URL is overridden to a database with real encrypted data.
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — generate one with `openssl rand -hex 32`}
      # LLM — Google Gemini API. PHI leaves the machine once this is set;
      # see README's privacy notice.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Same default as `Settings.gemini_model` (core/config.py) — kept in
      # sync on purpose, not re-derived, so a bare `docker compose up` and a
      # bare `uvicorn` run never silently pick different models.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      DEBUG: "false"
    healthcheck:
      # urllib instead of curl — the slim python base image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: platform/frontend
    container_name: sephiroth-frontend
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      # "api" is the compose service name, resolved on the compose network —
      # not 127.0.0.1, which inside this container would mean itself.
      NEXT_PUBLIC_API_URL: http://api:8000
      WATCHPACK_POLLING: "true" # bind-mount file changes need polling on Docker Desktop for Mac
    volumes:
      - ./platform/frontend:/app
      # Anonymous volumes so the host's node_modules/.next (different
      # OS/arch, or absent) never shadows what the image installed.
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:

# On-premise deployment: Postgres + API + Ollama, nothing leaving the building.
#
#   docker compose -f docker-compose.local.yml up -d
#
# A separate file rather than a profile on `docker-compose.yml`, because the
# two describe different deployments rather than one deployment with an extra
# service: this one pins the API to the local provider and forbids PHI egress,
# and a profile that silently changed those would be the kind of surprise
# SPEC-022 exists to remove.
#
# Before the first run, pull the models (see docs/05-operations/on-premise-runbook.md
# for sizes and smaller alternatives):
#
#   docker compose -f docker-compose.local.yml up -d ollama
#   docker compose -f docker-compose.local.yml exec ollama ollama pull qwen2.5:14b
#   docker compose -f docker-compose.local.yml exec ollama ollama pull nomic-embed-text
#
# Deliberately not automated (SPEC-022 NG-4): a multi-gigabyte download on
# first boot, with no progress anyone can see, is not a thing to do silently.

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: clinical_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — the dev default must not run a clinic}
      POSTGRES_DB: clinical_ai_db
    ports:
      # Bound to loopback, not 0.0.0.0: on a clinic LAN the default publishes
      # the database to every machine on the network.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical_ai -d clinical_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      # Named volume, so `docker compose down` does not throw away several
      # gigabytes of downloaded weights.
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Uncomment on a machine with an NVIDIA GPU. Without it Ollama runs on the
    # CPU, which works and is slow — see the runbook's model-size table.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://clinical_ai:${POSTGRES_PASSWORD}@postgres:5432/clinical_ai_db
      ENVIRONMENT: ${ENVIRONMENT:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — generate one with `openssl rand -hex 32`}
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:?PHI_ENCRYPTION_KEY is required outside development}
      # The point of this file. Both are already the defaults; they are stated
      # anyway, because a deployment handling real patients should say what it
      # does with the data rather than inherit it.
      LLM_PROVIDER: ollama
      AI_ALLOW_PHI: "false"
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      # A local model is slower than a hosted one; the default 120s is tight
      # for a 14B model answering on CPU.
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      DEBUG: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        # `service_started`, not `service_healthy`: the API degrades to
        # deterministic behaviour when the model is unavailable (SPEC-022
        # B-10/B-11), so a model still loading must not hold the whole
        # deployment down.
        condition: service_started

volumes:
  postgres_data:
  ollama_models:
